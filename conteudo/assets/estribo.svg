<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="480" height="330" rx="16" fill="#f8fafc"/>
  <text x="240" y="36" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="bold">Estribo — anel de aço, geralmente CA-60</text>

  <!-- Estribo retangular com gancho a 135 graus -->
  <g transform="translate(240,180)">
    <rect x="-70" y="-95" width="140" height="190" rx="8" fill="none" stroke="url(#steel)" stroke-width="9" stroke-linejoin="round"/>
    <!-- ganchos -->
    <path d="M-70,-65 l-24,-15" stroke="url(#steel)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-94,-80 l7,-17" stroke="url(#steel)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-70,65 l-24,15" stroke="url(#steel)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-94,80 l7,17" stroke="url(#steel)" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cotas -->
  <line x1="170" y1="66" x2="310" y2="66" stroke="#334155" stroke-width="1.5"/>
  <line x1="170" y1="60" x2="170" y2="72" stroke="#334155" stroke-width="1.5"/>
  <line x1="310" y1="60" x2="310" y2="72" stroke="#334155" stroke-width="1.5"/>
  <text x="240" y="56" font-size="13" text-anchor="middle" fill="#334155">largura da peça − cobrimento</text>

  <line x1="330" y1="85" x2="330" y2="275" stroke="#334155" stroke-width="1.5"/>
  <line x1="324" y1="85" x2="336" y2="85" stroke="#334155" stroke-width="1.5"/>
  <line x1="324" y1="275" x2="336" y2="275" stroke="#334155" stroke-width="1.5"/>
  <text x="342" y="184" font-size="13" fill="#334155">altura da peça − cobrimento</text>

  <!-- Legenda gancho -->
  <rect x="30" y="255" width="12" height="12" rx="2" fill="#ea580c"/>
  <text x="48" y="265" font-size="13" fill="#0f172a">gancho a 135° — ponta ≥ 5× a bitola, nunca menos de 5 cm</text>
</svg>
