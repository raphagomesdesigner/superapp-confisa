<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="coilFace" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>
  <rect width="480" height="330" rx="16" fill="#f8fafc"/>
  <text x="240" y="36" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="bold">Arame recozido — amarra a armadura</text>

  <!-- Rolo de arame: várias voltas concêntricas, textura de fio -->
  <g transform="translate(130,190)">
    <circle r="82" fill="url(#coilFace)" stroke="#475569" stroke-width="2"/>
    <circle r="34" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <g stroke="#64748b" stroke-width="1.4" fill="none" opacity="0.8">
      <circle r="46"/><circle r="54"/><circle r="62"/><circle r="70"/><circle r="78"/>
    </g>
    <g stroke="#475569" stroke-width="1" fill="none" opacity="0.5">
      <path d="M-60,-40 q60,40 0,80"/>
      <path d="M55,-55 q-70,55 5,110"/>
      <path d="M0,-82 q35,82 -3,164" transform="rotate(20)"/>
    </g>
  </g>
  <text x="130" y="292" font-size="14" text-anchor="middle" fill="#0f172a">Rolo de arame recozido</text>

  <!-- Amarração: duas barras cruzadas com arame torcido -->
  <g transform="translate(345,190)">
    <rect x="-75" y="-9" width="150" height="18" rx="9" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <rect x="-9" y="-75" width="18" height="150" rx="9" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <g stroke="#ea580c" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M-22,-22 L22,22"/>
      <path d="M22,-22 L-22,22"/>
      <path d="M-14,-30 L14,-2"/>
      <path d="M14,-30 L-14,-2"/>
    </g>
  </g>
  <text x="345" y="292" font-size="14" text-anchor="middle" fill="#0f172a">Amarração de barras cruzadas</text>
</svg>
