<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="330" rx="16" fill="#f8fafc"/>

  <!-- CA-50: barra com nervuras (rugosa) -->
  <g transform="translate(130,60)">
    <rect x="-14" y="0" width="28" height="190" rx="14" fill="url(#barA)"/>
    <g stroke="#1e293b" stroke-width="3" opacity="0.55">
      <path d="M-14,10 l28,14 M-14,34 l28,14 M-14,58 l28,14 M-14,82 l28,14 M-14,106 l28,14 M-14,130 l28,14 M-14,154 l28,14"/>
    </g>
  </g>
  <text x="130" y="40" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="bold">CA-50</text>
  <text x="130" y="270" font-size="13" text-anchor="middle" fill="#334155">Superfície rugosa (nervuras)</text>
  <text x="130" y="288" font-size="13" text-anchor="middle" fill="#334155">500 MPa</text>
  <text x="130" y="306" font-size="12" text-anchor="middle" fill="#64748b">pilares e vigas</text>

  <!-- CA-60: barra lisa -->
  <g transform="translate(350,60)">
    <rect x="-11" y="0" width="22" height="190" rx="11" fill="url(#barB)"/>
  </g>
  <text x="350" y="40" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="bold">CA-60</text>
  <text x="350" y="270" font-size="13" text-anchor="middle" fill="#334155">Superfície lisa</text>
  <text x="350" y="288" font-size="13" text-anchor="middle" fill="#334155">600 MPa</text>
  <text x="350" y="306" font-size="12" text-anchor="middle" fill="#64748b">estribos e telas de laje</text>

  <line x1="240" y1="55" x2="240" y2="255" stroke="#e2e8f0" stroke-width="2"/>
</svg>
